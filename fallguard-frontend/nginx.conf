# FallGuard frontend: static app + /api reverse proxy to the backend API (backend-module/api).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Resolve the backend at request time, so nginx starts even if the API isn't up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Live video is an endless MJPEG response: pass frames through as they arrive.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Live video (WebSocket), fall clips and snapshots come from stream-hub, which serves
    # everything under /stream-hub/. Without this block nginx answers with index.html.
    location /stream-hub/ {
        set $hub http://stream-hub:9000;
        proxy_pass $hub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Hashed build assets can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/live, /events/123, ...) all serve index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
