# FallGuard frontend: static app + reverse proxies to the backend API (backend-module/api)
# and to stream-hub (live video over WebSocket, and recorded clips/snapshots over HTTP).

# Only send "Connection: upgrade" on an actual WebSocket request; a plain HTTP request
# (a clip, a snapshot) gets a normal "close" so keep-alive to stream-hub isn't disrupted.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Resolve the backends at request time, so nginx starts even if they aren't up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;
    set $streamhub http://stream-hub:9000;

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # CSV exports stream as they're generated: pass bytes through as they arrive.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # stream-hub: the live-view WebSocket (video + live detections) and the HTTP routes for
    # recorded incident clips and snapshots. Both live under stream-hub's own /stream-hub
    # prefix, so this block forwards the path unchanged (proxy_pass has no path of its own).
    location /stream-hub/ {
        proxy_pass $streamhub;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Required for the WebSocket (live video) to upgrade; a plain HTTP request for a
        # clip or snapshot ignores these and works as a normal proxied response.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Live video and long-running connections: don't buffer, don't time out while idle.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Live video (WebSocket), fall clips and snapshots come from stream-hub, which serves
    # everything under /stream-hub/. Without this block nginx answers with index.html.
    location /stream-hub/ {
        set $hub http://stream-hub:9000;
        proxy_pass $hub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Hashed build assets can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/live, /events/123, ...) all serve index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}