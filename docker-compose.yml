# The whole platform in Docker: database, ML service, stream hub and gateway.
#
# Mode (dev / prod): .env next to this file, see .env.example. In dev it also starts the
# test camera (COMPOSE_PROFILES=test-camera).
#
#   docker compose up -d --build                         # everything
#   docker compose --profile test-camera up -d --build   # + the test camera, in prod too (see DOCKER.md)
#   docker compose ps
#   docker compose logs -f ml-service
#
# Each module also has its own compose file to run it alone. They all declare the same
# fixed-name Docker network "fallguard", so they can be started in any order.
#
#   camera (RTSP) ─► gateway-back :8080 ─► stream-hub :8090 (video in) ─► ml-service :9999 ─► db :5432
#                                              └─► ml-service's live detections, recording
#                                                  commands and snapshots come back on the
#                                                  same connection; stream-hub records the
#                                                  clips and stores the snapshots itself
#   browser ─► fallguard-frontend :3000 ─┬─► api :8000 ─► db, gateway-back
#                                        └─► stream-hub :9000 directly: live video (WebSocket)
#                                            and recorded clips/snapshots (HTTP)
name: fallguard

# Every module reads the one settings file: .env next to this file (see .env.example).
include:
  - path: backend-module/docker-compose.yml    # db, partitions, api
    env_file: .env
  - path: ml-service/setup_and_tools/docker_server/docker-compose.yml
    env_file: .env
  - path: stream-hub/docker-compose.yml
    env_file: .env
  - path: gateway-back/docker-compose.yml
    env_file: .env
  - path: fallguard-frontend/docker-compose.yml # http://localhost:3000
    env_file: .env

services:
  # An RTSP relay for testing without real cameras: this PC's webcam is published to it
  # as /webcam (ml-service/setup_and_tools/fake_cameras/publish_webcam.py), and /test plays test_videos/test.mp4 on
  # a loop while something watches it. Add them as rtsp://test-camera:8554/webcam or /test.
  test-camera:
    image: bluenviron/mediamtx:1.21.2-ffmpeg
    profiles: [test-camera]
    restart: unless-stopped
    environment:
      MTX_PATHS_TEST_RUNONDEMAND: >-
        ffmpeg -re -stream_loop -1 -i /media/test.mp4 -an
        -c:v libx264 -preset ultrafast -tune zerolatency -g 50 -pix_fmt yuv420p
        -f rtsp -rtsp_transport tcp rtsp://localhost:$$RTSP_PORT/$$MTX_PATH
      MTX_PATHS_TEST_RUNONDEMANDRESTART: "yes"
    volumes:
      - ./test_videos:/media:ro
    ports:
      - "8554:8554"                      # also playable from the host: rtsp://localhost:8554/test
    networks: [fallguard]
    logging:                           # cap Docker's log files (stream-hub logs every video chunk)
      driver: json-file
      options: {max-size: "10m", max-file: "3"}