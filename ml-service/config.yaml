# ml-service settings. Every option is explained in CONFIG.md.

# ---------------------------------------------------------------------------
# Mode switch
#   false = dev / prototyping: webcams, video files and IP cameras (the dev: section)
#   true  = production: IP cameras only (the prod: section)
# The container sets ML_PROD_MODE=true, which overrides this line.
# ---------------------------------------------------------------------------
prod_mode: false

# Used when prod_mode is false.
dev:
  sources:
    - type: webcam
      index: 0               # 0 = first camera, 1 = second, ... (try the other if the image is black)
      camera_id: local-webcam
    # - type: tcp            # also take the stream-hub cameras
    # - type: rtsp
    #   url: rtsp://user:password@192.168.1.50:554/stream1
    #   camera_id: hallway
    # - type: file
    #   path: videos/test-fall.mp4
    #   camera_id: replay-1
    #   loop: true
  preview: true              # window with the annotated video (press q to quit)
  server:
    host: 127.0.0.1          # only this PC can connect
  output:
    sinks: [jsonl]           # add postgres to also write to the database (needs ML_DATABASE_URL)

# Used when prod_mode is true. Only IP camera sources are allowed here: tcp and rtsp.
prod:
  sources:
    - type: tcp              # every camera stream-hub sends
    # - type: rtsp           # an IP camera read directly, e.g. while stream-hub is down
    #   url: rtsp://user:password@10.0.0.21:554/stream1
    #   camera_id: ward-a-hallway
  preview: false             # no display on a server
  server:
    host: 0.0.0.0            # accept stream-hub from other machines
  # Cameras that see the same area. A fall seen by several cameras of one zone raises one
  # incident instead of one per camera. Use the camera IDs gateway-back assigns.
  zones: {}
  #   ward-a: [3f2c8e1a-...-camera-1, 9b77d0c4-...-camera-2]
  #   lobby:  [5d1e...-camera-3, 0a9f...-camera-4, 77c2...-camera-5]
  # (zones set up in the database's zones table are loaded too; see database: below)
  output:
    sinks: [jsonl, postgres] # backend-module database; the URL comes from ML_DATABASE_URL
  viewer:
    host: 0.0.0.0            # inside the container; compose publishes it on 127.0.0.1 only

# ---------------------------------------------------------------------------
# Shared by both modes. A dev: or prod: section can override any of these.
# ---------------------------------------------------------------------------

# tcp source only. Must match ai_server_addr in stream-hub/config.json
server:
  port: 9999

# Live viewer in the browser: annotated video + recent incidents (no login: localhost only).
# The fallguard frontend shows the same video through the backend API.
viewer:
  enabled: true
  host: 127.0.0.1            # http://localhost:8000
  port: 8000
  fps: 5                     # frames per second sent to each browser
  jpeg_quality: 70

# Dashcam-style video clip of every incident (cameras from stream-hub only). Each camera
# keeps a short loop of compressed video in memory (~1-2 MB); on a fall the loop is saved
# together with the rest of the incident as an H.264 MP4 under <output dir>/clips.
clips:
  enabled: true
  pre_roll_s: 15             # video kept from before the fall
  post_roll_s: 10            # and after the person is back up / out of view
  max_s: 120                 # longest clip
  max_width: 1280            # scaled down to this width for smaller files
  crf: 28                    # H.264 quality: lower = better and bigger (18-32)
  buffer_mb: 64              # cap on each camera's in-memory loop
  retention_days: 30         # delete clips older than this (0 = keep)
  max_total_gb: 10           # then the oldest while the clips folder is bigger (0 = no cap)

# backend-module PostgreSQL (used when output.sinks includes postgres).
database:
  # Leave empty and set the ML_DATABASE_URL environment variable instead; the URL holds a
  # password. Format: postgresql://ml_service:<password>@<host>:5432/<database>
  url: ""
  connect_timeout_s: 5
  zones_from_db: true        # also use zones from the zones table + cameras.zone_id

handshake:
  # stream-hub's ai_worker.go currently sends only camera_id. Set to true once
  # it also sends tenant_id first, like gateway-back's frame_sender.go does.
  tenant_in_handshake: false
  # A tenants.slug or tenants.id from the database (demo-facility = seed.sql's tenant).
  default_tenant_id: demo-facility

inference:
  weights: yolo26n-pose.pt   # n = fastest; s/m are more accurate but slower
  device: auto               # auto = GPU 0 if CUDA is available, else CPU; or a GPU index, or cpu
  half: false                # FP16 on GPU; measure first, it was slower on an RTX 3060 laptop
  conf: 0.4
  imgsz: 640
  target_fps: 10             # frames per second sent to the model, per camera
  tracker: bytetrack.yaml

fall:
  min_keypoint_conf: 0.3
  lying_torso_angle_deg: 60
  falling_torso_angle_deg: 35
  lying_aspect_ratio: 1.3
  fall_velocity: 0.6         # hip drop, frame heights per second
  confirm_seconds: 3         # must stay down this long to open an incident
  recover_seconds: 3         # must stay up this long to close it
  lost_track_seconds: 10
  high_after_seconds: 60
  critical_after_seconds: 300   # 5min=300 Seconds; if the person is still down after this long, mark the incident as critical
  merge_window_seconds: 10   # zones: falls on different cameras of a zone starting this close together are one incident

output:
  dir: data
  prediction_interval_s: 1.0 # at most one model_predictions row per person per second
  stats_interval_s: 30       # log frames received/analysed per camera this often; 0 = off
