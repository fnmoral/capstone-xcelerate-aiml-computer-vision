# Ground truth for recorded videos used by the benchmark (python -m eval.benchmark).
# Paths are relative to this file. A missing file is skipped: videos are git-ignored.
# falls: [start, end] in seconds of the video for every period someone is down.
videos:
  - path: ../../test-media/fall.mp4
    falls: [[8.0, 22.0]]
    note: Staged - the picture is rotated 90 degrees from 8 s to 22 s, so both people suddenly look horizontal.
  - path: ../../test-media/test.mp4
    falls: []
    note: Two people standing and walking in front of a bus. Nobody falls.
