<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fondo azul realista -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2264cf" />
      <stop offset="50%" stop-color="#184ea3" />
      <stop offset="100%" stop-color="#0e3575" />
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="350" fill="url(#bgGrad)" rx="12" />

  <!-- Texto Principal -->
  <g transform="translate(90, 195)">
    <!-- Palabra XCELERATE -->
    <text x="0" y="0" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="900" font-size="115" fill="#ffffff" letter-spacing="4">XCELERATE</text>
    
    <!-- Subtítulo INDUSTRIES -->
    <text x="295" y="72" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="600" font-size="34" fill="#ffffff" letter-spacing="16">INDUSTRIES</text>
  </g>
</svg>