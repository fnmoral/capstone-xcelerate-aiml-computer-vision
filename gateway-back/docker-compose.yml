# gateway-back on its own (the whole stack: ../docker-compose.yml).
#   docker compose up -d --build
#   open http://localhost:8080
# Joins the shared "fallguard" network; stream-hub is reached as stream-hub:8090.
name: fallguard-gateway

services:
  gateway-back:
    build: .
    image: capstone/gateway-back:latest
    restart: unless-stopped
    environment:
      # Only used to create config.json on first start (see docker-entrypoint.sh).
      GATEWAY_CLOUD_ADDRESS: ${GATEWAY_CLOUD_ADDRESS:-stream-hub:8090}
      GATEWAY_TENANT_ID: ${GATEWAY_TENANT_ID:-demo-facility}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"   # web UI + /gateway/actions API
    volumes:
      - gateway-data:/data             # config.json + gateway.db (cameras)
    networks: [fallguard]
    logging:                           # cap Docker's log files (stream-hub logs every video chunk)
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  gateway-data:

networks:
  fallguard:
    name: fallguard               # shared by every module; whichever starts first creates it
