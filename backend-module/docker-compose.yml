# backend-module database: PostgreSQL 17 + pgvector, with the schema loaded on first start.
#
#   cd backend-module
#   cp .env.example .env        # then set the passwords
#   docker compose up -d
#   docker compose logs -f db
#
# Other containers reach it as  db:5432  by joining the shared "fallguard" network:
#
#   networks:
#     fallguard:
#       name: fallguard         # whichever project starts first creates it; the rest join
#
# Reset everything (schema changes, fresh seed):  docker compose down -v && docker compose up -d
name: fallguard-db

services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fallguard}
      POSTGRES_USER: ${POSTGRES_USER:-fallguard_admin}          # owns the tables
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      ML_SERVICE_PASSWORD: ${ML_SERVICE_PASSWORD:?set ML_SERVICE_PASSWORD in .env}
      # Demo data on first start: off in prod, on otherwise. Unset = prod (never demo data
      # by accident). SEED_DEMO_DATA=true/false overrides the mode.
      PROD_MODE: ${PROD_MODE:-true}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-}
      TENANT_SLUG: ${TENANT:-demo-facility}                     # without demo data: the tenant created (= the API's TENANT)
      TZ: UTC
    volumes:
      - db-data:/var/lib/postgresql/data
      # Run once, in name order, only when the data volume is empty:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/init/02-seed.sh:/docker-entrypoint-initdb.d/02-seed.sh:ro
      - ./db/init/03-roles.sh:/docker-entrypoint-initdb.d/03-roles.sh:ro
      - ./db/seed.sql:/seed/seed.sql:ro
    ports:
      # Host access for psql / DB tools / ml-service running outside Docker.
      # Only this machine by default; set DB_BIND=0.0.0.0 to open it to the network.
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-5432}:5432"
    networks:
      fallguard:
        aliases: [postgres]           # reachable as db or postgres
    logging:                           # cap Docker's log files (stream-hub logs every video chunk)
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Core backend API (Module 2): the REST API the fallguard frontend talks to. It reads the
  # database and manages cameras through gateway-back; video/photos come from ml-service.
  api:
    build: ./api
    image: capstone/backend-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Table owner for now; switch to a restricted role once user accounts exist.
      DATABASE_URL: postgresql://${POSTGRES_USER:-fallguard_admin}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-fallguard}
      TENANT: ${TENANT:-demo-facility}
      PROD_MODE: ${PROD_MODE:-true}            # dev (false): adds the PC's webcam to an empty gateway
      GATEWAY_URL: ${GATEWAY_URL:-http://gateway-back:8080}
      ML_URL: ${ML_URL:-http://ml-service:8000}
      STREAM_HUB_URL: ${STREAM_HUB_URL:-http://stream-hub:9000}
    ports:
      - "127.0.0.1:${API_PORT:-8100}:8000"   # for debugging; the frontend reaches it as api:8000
    networks: [fallguard]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # Keeps monthly partitions created ahead of time (see create_monthly_partitions in
  # schema.sql). Runs as the table owner, once at start and then daily.
  partitions:
    image: pgvector/pgvector:0.8.7-pg17
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-fallguard}
      PGUSER: ${POSTGRES_USER:-fallguard_admin}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      MONTHS_AHEAD: ${PARTITION_MONTHS_AHEAD:-3}
    volumes:
      - ./db/init/partitions.sh:/partitions.sh:ro
    entrypoint: ["bash", "/partitions.sh"]
    networks: [fallguard]
    logging:                           # cap Docker's log files (stream-hub logs every video chunk)
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  db-data:

networks:
  fallguard:
    name: fallguard                   # fixed name, shared by every module's compose file
